name: Dev release

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
      - name: System dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq openvpn easy-rsa
      - name: Lint + tests
        run: |
          make lint
          go test ./...
      - name: Build
        run: |
          SHA="$(git rev-parse --short HEAD)"
          DATE="$(date -u +%Y%m%d)"
          COUNT="$(git rev-list --count --since="${DATE:0:4}-${DATE:4:2}-${DATE:6:2}T00:00:00Z" HEAD)"
          VER="dev-${DATE}.${COUNT}-${SHA}"
          echo "VER=${VER}" >> "$GITHUB_ENV"
          for arch in amd64 arm64; do
            out="ovnode-linux-${arch}"
            GOOS=linux GOARCH="${arch}" CGO_ENABLED=0 go build -trimpath \
              -ldflags "-s -w -X ovnode/internal/version.Version=${VER}" \
              -o "${out}" ./cmd/ovnode
          done
      - name: Publish dev release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view dev >/dev/null 2>&1 || gh release create dev --title "dev" --prerelease --notes "Rolling dev build from main."
          gh release upload dev ovnode-linux-amd64 ovnode-linux-arm64 --clobber
