name: Release assets

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
      - name: System dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq openvpn easy-rsa iptables iproute2 logrotate minisign
      - name: Lint
        run: make lint
      - name: Go tests
        run: go test ./...

  assets:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"

      - name: Verify tag matches version constant
        if: startsWith(github.ref_name, 'v')
        run: |
          VER="$(grep -m1 -E '(const|var) Version' internal/version/version.go | cut -d'"' -f2)"
          [ "${VER}" = "${GITHUB_REF_NAME#v}" ] || { echo "tag does not match internal/version/version.go"; exit 1; }

      # Bare per-platform binaries, each with a .sha256 sidecar. No tarball:
      # the installer downloads the product and its checksum, and the product
      # carries the shell files it needs. A release used to ship the whole
      # source tree, so every box ended up with a checkout of the repository
      # in /opt/ovnode.
      - name: System dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq minisign

      - name: Build platform binaries
        run: |
          VER="$(go run ./cmd/ovnode version)"
          echo "VER=${VER}" >> "$GITHUB_ENV"
          for arch in amd64 arm64; do
            out="ovnode-linux-${arch}"
            GOOS=linux GOARCH="${arch}" CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o "${out}" ./cmd/ovnode
            sha256sum "${out}" > "${out}.sha256"
          done

      - name: Sign platform binaries
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          printf '%s' "$MINISIGN_SECRET_KEY" > /tmp/ovnode.key
          for arch in amd64 arm64; do
            minisign -S -s /tmp/ovnode.key -m "ovnode-linux-${arch}"
          done
          rm -f /tmp/ovnode.key

      - name: Ensure release exists
        if: startsWith(github.ref_name, 'v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh release view "${TAG}" >/dev/null 2>&1 || gh release create "${TAG}" --title "${TAG}" --generate-notes

      - name: Publish installer checksum
        run: sha256sum install.sh > install.sh.sha256

      - name: Upload assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "v${VER}" \
            install.sh install.sh.sha256 \
            ovnode-linux-amd64 ovnode-linux-amd64.sha256 ovnode-linux-amd64.minisig \
            ovnode-linux-arm64 ovnode-linux-arm64.sha256 ovnode-linux-arm64.minisig --clobber
