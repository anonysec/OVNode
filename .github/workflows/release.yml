name: Release assets

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
      - name: System dependencies
        # OpenVPN/easy-rsa tests skip when the binaries are absent; a flaky
        # mirror must not turn the whole pipeline red.
        continue-on-error: true
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq openvpn easy-rsa iptables iproute2 logrotate
      - name: Version parity
        run: make check-version
      - name: Lint
        run: make lint
      - name: Go tests
        run: go test ./...

  assets:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"

      - name: Verify tag matches version constant
        if: startsWith(github.ref_name, 'v')
        run: |
          VER="$(grep -m1 -E '(const|var) Version' internal/version/version.go | cut -d'"' -f2)"
          [ "${VER}" = "${GITHUB_REF_NAME#v}" ] || { echo "tag does not match internal/version/version.go"; exit 1; }

      - name: Build platform binaries
        run: |
          VER="$(go run ./cmd/ovnode version)"
          echo "VER=${VER}" >> "$GITHUB_ENV"
          for arch in amd64 arm64; do
            out="ovnode-linux-${arch}"
            GOOS=linux GOARCH="${arch}" CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o "${out}" ./cmd/ovnode
          done
          sha256sum ovnode-linux-* > SHA256SUMS
      - name: Ensure release exists
        if: startsWith(github.ref_name, 'v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh release view "${TAG}" >/dev/null 2>&1 || gh release create "${TAG}" --title "${TAG}" --generate-notes

      - name: Upload assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "v${VER}" --clobber \
            internal/assets/install.sh \
            ovnode-linux-amd64 ovnode-linux-arm64 \
            SHA256SUMS
