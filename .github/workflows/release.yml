name: Release assets

# Builds the versioned install tarball and attaches it to the published
# GitHub Release, so install.sh --from-release (the default) can install
# without git.
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  # No test gate here: ci.yml runs the same suite on every push/PR, and a
  # second copy of the job was a second place for the two to drift.
  assets:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pack release tarball
        run: |
          VER="$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)"
          STAGE="$(mktemp -d)"
          git archive HEAD | tar -x -C "$STAGE"
          # --owner/--group: the runner's uid would otherwise be baked into the
          # archive and restored by a root extract on the target host.
          tar --owner=0 --group=0 -czf "ovnode-${VER}.tar.gz" -C "$STAGE" .
          sha256sum "ovnode-${VER}.tar.gz" > "ovnode-${VER}.sha256"
          echo "VER=${VER}" >> "$GITHUB_ENV"

      - name: Upload assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "v${VER}" "ovnode-${VER}.tar.gz" "ovnode-${VER}.sha256" --clobber
