name: Release assets

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - name: System dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq openvpn easy-rsa iptables iproute2 logrotate
      - name: Lint
        run: make lint
      - name: Go tests
        run: go test ./...

  assets:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27"

      # Bare per-platform binaries, each with a .sha256 sidecar. No tarball:
      # the installer downloads the product and its checksum, and the product
      # carries the shell files it needs. A release used to ship the whole
      # source tree, so every box ended up with a checkout of the repository
      # in /opt/ovnode.
      - name: Build platform binaries
        run: |
          VER="$(go run ./cmd/ovnode version)"
          echo "VER=${VER}" >> "$GITHUB_ENV"
          for arch in amd64 arm64; do
            out="ovnode-linux-${arch}"
            GOOS=linux GOARCH="${arch}" CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o "${out}" ./cmd/ovnode
            sha256sum "${out}" > "${out}.sha256"
          done

      - name: Upload assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "v${VER}" \
            ovnode-linux-amd64 ovnode-linux-amd64.sha256 \
            ovnode-linux-arm64 ovnode-linux-arm64.sha256 --clobber
