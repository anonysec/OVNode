name: Build & Push Docker Image

on:
  push:
    tags:
      - 'v*'
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # GITHUB_TOKEN can only write to a package that is *linked* to the repo
      # this workflow runs for, so if a package is ever deleted and recreated
      # outside a workflow the link is lost and every push to main fails with
      # "denied: permission_denied: write_package" — while the build succeeds,
      # so the log reads like a build problem and is not one. That is what
      # happened here until 1 October 2026: both packages were user-owned and
      # unlinked, and the publish had been broken on every push since 30
      # September. They are linked now, verified through the API, and no
      # credential is stored in this repository.
      #
      # The token override is kept as the way out if that link is ever lost
      # again. It is deliberately unset: a token with write:packages is also a
      # token that can publish anything, and GITHUB_TOKEN cannot.
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME || github.actor }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max