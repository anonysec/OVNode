name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: "1.27"
      - name: System dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq openvpn easy-rsa iptables iproute2 logrotate shellcheck
      - name: Shell syntax
        run: bash -n install.sh ovnode.sh lib.sh doctor.sh scripts/compose/*.sh
      - name: Go tests
        run: go test -race ./...

      - name: Vulnerability scan
        run: |
          # Pinned: bump deliberately (Dependabot does not track go install).
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          govulncheck ./...
      - name: Static analysis
        run: |
          # Pinned: bump deliberately (Dependabot does not track go install).
          go install honnef.co/go/tools/cmd/staticcheck@2025.1.1
          staticcheck ./...
          # Pinned: bump deliberately (Dependabot does not track go install).
          go install github.com/securego/gosec/v2/cmd/gosec@v2.22.4
          gosec ./...
      - name: Shellcheck
        run: shellcheck install.sh lib.sh ovnode.sh
      - name: Contract drift check
        run: |
          curl -fsSL -o /tmp/panel-contract.json             https://raw.githubusercontent.com/anonysec/OVManager/main/internal/node/contract.json || {
            echo "panel contract not reachable; skipping (first run before publish)"
            exit 0
          }
          if ! diff -q internal/httpapi/contract.json /tmp/panel-contract.json >/dev/null; then
            echo "::error::node contract.json differs from panel authority"
            diff internal/httpapi/contract.json /tmp/panel-contract.json || true
            exit 1
          fi
          echo "contract: in sync"
      - name: Installer regression tests
        run: bash scripts/test-installer.sh

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: "1.27"
      - run: make lint

  build:
    needs: [test, lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: "1.27"
      - run: go build ./cmd/ovnode
