name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - name: System dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq openvpn easy-rsa iptables iproute2 logrotate
      - name: Shell syntax
        run: bash -n install.sh ovnode.sh lib.sh doctor.sh scripts/compose/*.sh
      - name: Go tests
        run: go test ./...

      - name: Contract drift check
        run: |
          curl -fsSL -o /tmp/panel-contract.json             https://raw.githubusercontent.com/anonysec/OVManager/main/internal/node/contract.json || {
            echo "panel contract not reachable; skipping (first run before publish)"
            exit 0
          }
          if ! diff -q internal/httpapi/contract.json /tmp/panel-contract.json >/dev/null; then
            echo "::error::node contract.json differs from panel authority"
            diff internal/httpapi/contract.json /tmp/panel-contract.json || true
            exit 1
          fi
          echo "contract: in sync"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - run: make lint

  build:
    needs: [test, lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - run: go build ./cmd/ovnode