name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
      - name: System dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq openvpn easy-rsa iptables iproute2 logrotate shellcheck
      - name: Shell syntax
        run: make check-bash
      - name: Go build
        run: go build ./...
      - name: Go tests
        run: go test -race ./...

      - name: Vulnerability scan
        run: |
          # Pinned: bump deliberately (Dependabot does not track go install).
          go install golang.org/x/vuln/cmd/govulncheck@v1.2.0
          govulncheck ./...
      - name: Static analysis
        run: |
          # Pinned: bump deliberately (Dependabot does not track go install).
          go install honnef.co/go/tools/cmd/staticcheck@2026.2.2
          staticcheck ./...
          # Pinned: bump deliberately (Dependabot does not track go install).
          go install github.com/securego/gosec/v2/cmd/gosec@v2.30.0
          go install golang.org/x/tools/cmd/deadcode@v0.52.0
          test -z "$(deadcode -test ./... 2>&1)"
      - name: Shellcheck
        run: shellcheck -S warning install.sh lib.sh ovnode.sh scripts/smoke-test.sh
      - name: Contract drift check
        run: |
          if ! curl -fsSL -o /tmp/panel-contract.json             https://raw.githubusercontent.com/anonysec/OVManager/main/internal/node/contract.json; then
            if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]] || [[ "${GITHUB_REF_NAME:-}" == v* ]]; then
              echo "::error::panel contract unreachable on tagged release build — refusing to publish"
              exit 1
            fi
            echo "panel contract not reachable; skipping (non-tagged build or fork)"
            exit 0
          fi
          if ! diff -u internal/httpapi/contract.json /tmp/panel-contract.json; then
            echo "::error::node vendored contract.json differs from panel contract.json"
            exit 1
          fi
      - name: Installer regression tests
        run: bash scripts/test-installer.sh

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
      - run: make lint

  build:
    needs: [test, lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
      - run: go build ./cmd/ovnode
