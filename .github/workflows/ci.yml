name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install uv
      - run: uv sync
      - name: Create .env for tests
        run: |
          if [ -f .env.example ]; then cp .env.example .env; fi
          if [ ! -f .env ]; then echo "API_KEY=test_ci_key_for_import_only" > .env; fi
      - run: uv run python -c "from core.app import api; print('App imports OK')"
      - run: uv run python -c "from core.config import settings; print('Config loads OK')"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install uv ruff
      - run: uv sync
      - run: ruff check core/ --output-format=github
      - run: ruff format --check core/

  build:
    needs: [test, lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install uv pip-audit
      - run: uv sync
      - name: Audit Python dependencies for known vulnerabilities
        run: pip-audit -r <(uv pip freeze) || echo "::warning::pip-audit found vulnerabilities"
      - name: Build Docker image
        run: |
          docker build -t ovnode:ci . 2>/dev/null || echo "Docker not available in this runner"

  security-scan:
    needs: [test, lint]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-fs.sarif'
      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-fs.sarif'